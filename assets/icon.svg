<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e25"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="top"><polygon points="0,0 1024,0 1024,380 0,700"/></clipPath>
    <clipPath id="bot"><polygon points="0,748 1024,428 1024,1024 0,1024"/></clipPath>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="480" rx="220" fill="url(#edge)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="218" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <!-- play cortado: a metade de baixo desliza (jump cut) -->
  <g clip-path="url(#top)">
    <path d="M378 262 C378 228 414 207 444 224 L760 406 C790 423 790 467 760 484 L444 666 C414 683 378 662 378 628 Z" fill="url(#play)"/>
  </g>
  <g clip-path="url(#bot)" transform="translate(-34 22)">
